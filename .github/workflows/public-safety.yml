name: Public showcase safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate whitespace
        run: git diff --check HEAD~1..HEAD || git diff --check

      - name: Reject private runtime and implementation artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden='(^|/)(\.env|secrets\.yaml|\.storage|examples)(/|$)|(^|/)[^/]+\.(xcodeproj|xcworkspace)(/|$)|\.(db|sqlite|sqlite3|key|pem|p8|p12|pfx|mobileprovision|xcresult|zip|tar|tgz|gz|swift|pbxproj|xcconfig|entitlements|storekit|plist|xcscheme|xcworkspacedata|diff|patch)$'
          if git ls-files | grep -Ei "$forbidden"; then
            echo "Forbidden private, runtime, reusable implementation, or patch artifact tracked." >&2
            exit 1
          fi

      - name: Reject Swift source-shaped excerpts
        shell: bash
        run: |
          set -Eeuo pipefail
          patterns='^[[:space:]]*import[[:space:]]+(SwiftUI|Foundation|SwiftData|CloudKit|StoreKit|HealthKit)([[:space:]]|$)|^[[:space:]]*@(main|Model|State|StateObject|ObservedObject|Environment|EnvironmentObject|Query|Published|AppStorage)([[:space:](]|$)|^[[:space:]]*(public[[:space:]]+|private[[:space:]]+|internal[[:space:]]+|fileprivate[[:space:]]+)?(struct|class|actor|enum|protocol)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*.*\{[[:space:]]*$|^[[:space:]]*(public[[:space:]]+|private[[:space:]]+|internal[[:space:]]+|fileprivate[[:space:]]+)?func[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(|^[[:space:]]*(public[[:space:]]+|private[[:space:]]+|internal[[:space:]]+|fileprivate[[:space:]]+)?var[[:space:]]+body[[:space:]]*:[[:space:]]*some[[:space:]]+View'
          if grep -RInE --exclude-dir=.git --exclude='public-portfolio-safety.yml' --exclude='public-safety.yml' "$patterns" .; then
            echo "Swift source-shaped excerpt found in public material." >&2
            exit 1
          fi

      - name: Scan for high-confidence secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          patterns='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk-[A-Za-z0-9]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]+'
          if grep -RInE --exclude-dir=.git "$patterns" .; then
            echo "High-confidence secret pattern found." >&2
            exit 1
          fi

      - name: Reject private IPv4 ranges
        shell: bash
        run: |
          set -Eeuo pipefail
          patterns='(^|[^0-9])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})([^0-9]|$)'
          if grep -RInE --exclude-dir=.git "$patterns" .; then
            echo "Private IPv4 address found in public showcase." >&2
            exit 1
          fi

      - name: Reject environment-specific identifiers
        shell: bash
        run: |
          set -Eeuo pipefail
          patterns='entity_id:|(^|[^A-Za-z0-9_])(sensor|binary_sensor|light|switch|climate|humidifier|fan|weather)\.[A-Za-z0-9_]+'
          if grep -RInE --exclude-dir=.git --exclude='public-safety.yml' "$patterns" .; then
            echo "Environment-shaped Home Assistant identifier found in public showcase." >&2
            exit 1
          fi

      - name: Confirm non-deployable public boundary
        run: |
          grep -Fq 'This is a portfolio case study, not a deployment package.' README.md
          grep -Fq 'reusable configuration examples' README.md
