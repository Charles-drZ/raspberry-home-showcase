name: Materialize Midnight hero

on:
  push:
    branches:
      - showcase/midnight-cross-device-hero

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: showcase/midnight-cross-device-hero

      - name: Reconstruct reviewed asset
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p assets/visuals
          cat .asset-staging/midnight-hero.part*.b64 \
            | base64 --decode \
            > assets/visuals/raspberry-home-midnight-across-devices.webp
          test "$(sha256sum assets/visuals/raspberry-home-midnight-across-devices.webp | awk '{print $1}')" = \
            "4eb0eb009674d4c8e16898446161b4ee96af14862cf51b83087f2ebbcf61f614"
          file assets/visuals/raspberry-home-midnight-across-devices.webp
          rm -rf .asset-staging
          rm -f .github/workflows/materialize-midnight-hero.yml

      - name: Commit materialized asset
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: add Midnight cross-device hero"
          git push origin HEAD:showcase/midnight-cross-device-hero
