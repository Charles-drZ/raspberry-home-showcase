title: Portfolio Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    theme: Portfolio Home
    sections:
      - type: grid
        background: true
        cards:
          - type: heading
            heading: Overview
            icon: mdi:view-dashboard-outline
            badges:
              - type: entity
                entity: sensor.indoor_temperature
                name: Indoor
                show_state: true
              - type: entity
                entity: sensor.outdoor_temperature
                name: Outdoor
                show_state: true
              - type: entity
                entity: sensor.bedroom_humidity
                name: Humidity
                show_state: true

          - type: weather-forecast
            entity: weather.home
            name: Home
            forecast_type: daily
            show_current: true
            show_forecast: true

          - type: thermostat
            entity: climate.living_room
            name: Main climate

      - type: grid
        background: true
        cards:
          - type: heading
            heading: Living space
            icon: mdi:sofa-outline

          - type: tile
            entity: light.living_room
            name: Lighting
            icon: mdi:ceiling-light
            color: amber
            features:
              - type: light-brightness
              - type: light-color-temp

          - type: tile
            entity: climate.living_room
            name: Climate quick control
            icon: mdi:air-conditioner
            color: light-blue
            features:
              - type: climate-hvac-modes
                style: icons

          - type: tile
            entity: sensor.living_room_power
            name: Current power
            icon: mdi:flash

      - type: grid
        background: true
        cards:
          - type: heading
            heading: Bedroom
            icon: mdi:bed-king-outline
            badges:
              - type: entity
                entity: sensor.bedroom_temperature
                show_state: true
              - type: entity
                entity: sensor.bedroom_humidity
                show_state: true
              - type: entity
                entity: binary_sensor.dehumidifier_tank_full
                name: Tank
                show_state: true

          - type: humidifier
            entity: humidifier.bedroom
            name: Dehumidifier

          - type: tile
            entity: fan.bedroom_dehumidifier
            name: Fan
            icon: mdi:fan
            color: cyan
            features:
              - type: fan-speed

          - type: tile
            entity: switch.bedroom_socket
            name: Socket
            icon: mdi:power-socket
            color: green

      - type: grid
        background: true
        cards:
          - type: heading
            heading: Bathroom
            icon: mdi:shower

          - type: tile
            entity: light.bathroom
            name: Lighting
            icon: mdi:ceiling-light
            color: amber

          - type: tile
            entity: switch.bathroom_extractor
            name: Extractor
            icon: mdi:fan
            color: cyan

          - type: tile
            entity: sensor.bathroom_humidity
            name: Humidity
            icon: mdi:water-percent

      - type: grid
        background: true
        cards:
          - type: heading
            heading: Utility
            icon: mdi:tools

          - type: tile
            entity: switch.water_heater
            name: Water heater
            icon: mdi:water-boiler
            color: deep-orange

          - type: tile
            entity: sensor.water_heater_power
            name: Current power
            icon: mdi:flash

# Public-safe example only.
# Replace placeholders with reviewed local entity IDs in a private configuration.
